# Nginx site for the wedding planner running in a Podman container.
# The container serves both the Vue app and the API on 127.0.0.1:3000, so Nginx
# only terminates TLS and proxies everything to it.
# Install:  sudo cp deploy/nginx/wedding-plan.sanfarish.com.podman.conf /etc/nginx/sites-available/wedding-plan.sanfarish.com.conf
#           sudo ln -s /etc/nginx/sites-available/wedding-plan.sanfarish.com.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wedding-plan.sanfarish.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on Ubuntu 20.04's Nginx 1.18 (`http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wedding-plan.sanfarish.com;

    ssl_certificate     /etc/letsencrypt/live/wedding-plan.sanfarish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedding-plan.sanfarish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    # The app (helmet) sends HSTS, CSP and the other security headers itself.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot forge their IP; the app trusts exactly one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
