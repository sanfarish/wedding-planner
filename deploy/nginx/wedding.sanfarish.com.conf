# Nginx site for the wedding planner.
# Install:  sudo cp deploy/nginx/wedding.sanfarish.com.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/wedding.sanfarish.com.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# APP_ROOT below assumes the repository lives in /var/www/wedding.sanfarish.com.

server {
    listen 80;
    listen [::]:80;
    server_name wedding.sanfarish.com;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on Ubuntu 20.04's Nginx 1.18 (`http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wedding.sanfarish.com;

    ssl_certificate     /etc/letsencrypt/live/wedding.sanfarish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedding.sanfarish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Built Vue app. The SQLite database and uploads live under server/ and are never served.
    root /var/www/wedding.sanfarish.com/client/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Security headers. Note: a location block with its own add_header stops
    # inheriting these, so the locations below only use `expires`.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Vuetify injects its theme as an inline <style>, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> Express on localhost only
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets can be cached forever
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the app shell so deploys take effect immediately
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths render index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
